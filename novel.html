<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小说阅读页</title>
<style>
:root{--bg:#fdfbf7;--fg:#2b2620;--muted:#8a8272;--line:#e8e0d2;--accent:#b07d3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Serif SC",serif;-webkit-font-smoothing:antialiased}
body.night{--bg:#171512;--fg:#cfc8bd;--muted:#8d867c;--line:#2e2a26;--accent:#d0a05e}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;z-index:10}
header h1{font-size:17px;margin:0 0 2px}header .author{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar button,.toolbar a{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:6px 12px;font-size:13px;text-decoration:none}
#toc{position:fixed;inset:0 auto 0 0;width:min(300px,80vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s;z-index:20;overflow-y:auto;padding:16px}
#toc.open{transform:none}#toc h2{font-size:15px;margin:0 0 10px}
.toc-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:9px 2px;font-size:14px}
.toc-item.active{color:var(--accent);font-weight:700}
main{max-width:720px;margin:0 auto;padding:20px 20px calc(88px + env(safe-area-inset-bottom))}
.chapter h2{font-size:19px;margin:8px 0 18px}.chapter p{line-height:1.9;margin:0 0 1em;text-align:justify}
.nav{display:flex;justify-content:space-between;gap:12px;margin:28px 0}
.nav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:12px;font-size:15px}
.nav button:disabled{opacity:.35}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:15}
#mask.show{display:block}
.status{color:var(--muted);font-size:14px;line-height:1.8}
.status button{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:6px 12px;font-size:13px}
.footnote{max-width:720px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px;line-height:1.8}
.footnote a{color:var(--accent)}
</style></head>
<body>
<header><h1 id="bookTitle">加载中…</h1><div class="author" id="bookAuthor"></div></header>
<div class="toolbar">
<button id="tocBtn">📑 目录</button>
<button id="fontMinus">A-</button><button id="fontPlus">A+</button>
<button id="lineBtn">行距</button><button id="nightBtn">🌙 夜间</button>
<a id="sourceLink" href="#" target="_blank" rel="noopener">原站 ↗</a>
</div>
<div id="mask"></div>
<nav id="toc"><h2 id="tocTitle">目录</h2><div id="tocList"></div></nav>
<main id="content"><p class="status" id="statusText">正在加载目录…</p></main>
<div style="max-width:720px;margin:0 auto;padding:0 20px 40px"><div class="nav">
<button id="prevBtn" disabled>← 上一章</button><button id="nextBtn" disabled>下一章 →</button>
</div></div>
<p class="footnote">内容由源站提供，本页仅做排版呈现（正文不经过机器人服务器存储）。若加载失败，可点上方「原站」直接在源站阅读。</p>
<script>
(function(){
const params = new URLSearchParams(location.search);
const site = params.get("site") || "";
const bookId = params.get("id") || "";
const bookUrl = params.get("url") || "";
const dirParam = params.get("dir") || "";
const paramTitle = params.get("title") || "";
const paramAuthor = params.get("author") || "";
const WORKER = "https://book-proxy.qqbookproxy.workers.dev/";
const SITE_NAMES = { sto66: "思兔", kudushu: "苦读书", suduguu: "速读谷", booksky: "快眼", pinshuzhai: "品书斋" };
const SITE_HOSTS = { kudushu: ["www.kudushu.org"], suduguu: ["www.suduguu.com"], booksky: ["www.xbotaodz.info"], pinshuzhai: ["www.pinshuzhai.com"] };
const statusEl = document.getElementById("statusText");
const mainEl = document.getElementById("content");
const sourceLinkEl = document.getElementById("sourceLink");
const footnoteEl = document.querySelector(".footnote");
let sourceUrl = "", sourceLabel = "原站";
function fail(msg){
  statusEl.innerHTML = "";
  const p = document.createElement("p"); p.className = "status"; p.textContent = msg + " ";
  const retry = document.createElement("button"); retry.textContent = "重试";
  retry.onclick = () => location.reload();
  p.appendChild(retry);
  if (sourceUrl) {
    p.appendChild(document.createTextNode(" "));
    const src = document.createElement("a"); src.href = sourceUrl;
    src.target = "_blank"; src.rel = "noopener"; src.textContent = "去" + sourceLabel + "读";
    p.appendChild(src);
  }
  statusEl.appendChild(p);
}
if (!SITE_NAMES[site]) {
  document.getElementById("bookTitle").textContent = "链接无效";
  fail("这条链接的书源不支持，请回机器人重新搜书。");
  return;
}
if (site === "sto66") {
  if (!/^[A-Za-z0-9]+$/.test(bookId)) {
    document.getElementById("bookTitle").textContent = "链接无效";
    fail("这条链接只支持思兔（site=sto66），请回机器人重新搜书。");
    return;
  }
  sourceUrl = "https://www.sto66.com/book/" + bookId + ".html";
  sourceLabel = "思兔原站";
} else {
  let ok = false;
  try {
    const u = new URL(bookUrl);
    ok = /^https?:$/.test(u.protocol) && (SITE_HOSTS[site] || []).includes(u.hostname);
  } catch (e) { ok = false; }
  if (!ok) {
    document.getElementById("bookTitle").textContent = "链接无效";
    fail("这条链接的书页地址无效，请回机器人重新搜书。");
    return;
  }
  sourceUrl = bookUrl;
  sourceLabel = SITE_NAMES[site] + "原站";
}
sourceLinkEl.href = sourceUrl;
sourceLinkEl.textContent = sourceLabel + " ↗";
if (footnoteEl) {
  footnoteEl.textContent = site === "sto66"
    ? "内容由思兔阅读提供，本页仅做排版呈现（浏览器直连思兔，不经过机器人服务器）。若加载失败，可点上方「思兔原站」直接在源站阅读。"
    : "内容由" + SITE_NAMES[site] + "提供，本页经中转 Worker 取源站内容排版呈现（正文不经过机器人服务器存储）。若加载失败，可点上方「" + sourceLabel + "」直接在源站阅读。";
}
statusEl.textContent = "正在从" + SITE_NAMES[site] + "加载目录…";
function hashStr(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const KEY = site === "sto66" ? "novel-sto66-" + bookId + "-progress" : "novel-" + site + "-" + hashStr(bookUrl) + "-progress";
let chapters = [];
let cur = 0, fontSize = 19, lineH = 1.9;
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) {
    fontSize = saved.fontSize || 19; lineH = saved.lineH || 1.9;
    if (saved.night) document.body.classList.add("night");
    if (Number.isInteger(saved.chapter)) cur = saved.chapter;
  }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({chapter: cur, fontSize, lineH, night: document.body.classList.contains("night")})); } catch (e) {} }
function apply(){
  mainEl.style.fontSize = fontSize + "px";
  mainEl.querySelectorAll(".chapter p").forEach(p => p.style.lineHeight = lineH);
  document.getElementById("nightBtn").textContent = document.body.classList.contains("night") ? "☀️ 日间" : "🌙 夜间";
}
function esc(s){ return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
async function fetchDoc(url, viaWorker){
  const target = viaWorker ? WORKER + "?u=" + encodeURIComponent(url) : url;
  const res = await fetch(target, { headers: { "Accept": "text/html" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const html = await res.text();
  return new DOMParser().parseFromString(html, "text/html");
}
function absUrl(href, base){
  try { return new URL(href, base).toString(); } catch (e) { return ""; }
}
function extractParas(box, dropRe){
  if (!box) throw new Error("正文解析失败");
  const ps = [...box.querySelectorAll("p")].map(p => p.textContent.trim()).filter(Boolean);
  let out = ps;
  if (!out.length) {
    const lines = [];
    let curLine = "";
    const walk = (node) => {
      if (node.nodeType === 3) curLine += node.textContent;
      else if (node.nodeName === "BR") { lines.push(curLine); curLine = ""; }
      else node.childNodes.forEach(walk);
    };
    box.childNodes.forEach(walk);
    if (curLine) lines.push(curLine);
    out = lines.map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  }
  if (dropRe) out = out.filter(s => !dropRe.test(s));
  return out;
}
function longestTextEl(root){
  let best = null, bestLen = 0;
  if (!root) return null;
  root.querySelectorAll("div, article").forEach(el => {
    const len = (el.textContent || "").trim().length;
    if (len > bestLen) { bestLen = len; best = el; }
  });
  return bestLen > 500 ? best : null;
}
function parseTitleAuthor(doc, rawHtml){
  let title = "", author = "";
  const t = (doc.title || "").split("-")[0] || "";
  const pm = t.match(/^(.*?)\(([^)]+)\)\s*$/);
  if (pm) { title = pm[1].trim(); author = pm[2].trim(); }
  else if (t) { title = t.replace(/全文免费阅读.*$/, "").trim(); }
  if (!author) {
    const am = rawHtml.match(/作者：([^<\n]{1,30})/);
    if (am) author = am[1].trim();
  }
  return { title: title || "思兔小说", author: author || "" };
}
function setMeta(title, author){
  document.getElementById("bookTitle").textContent = title;
  document.getElementById("bookAuthor").textContent = author;
  document.title = title + " - 小说阅读页";
}
async function loadSto66Catalog(){
  const BASE = "https://www.sto66.com";
  const bookDoc = await fetchDoc(BASE + "/book/" + bookId + ".html", true);
  const raw = bookDoc.documentElement.outerHTML;
  const meta = parseTitleAuthor(bookDoc, raw);
  setMeta(meta.title, meta.author);
  const seen = new Set();
  let pageUrl = BASE + "/chapter/" + bookId + ".html";
  for (let page = 0; page < 30 && pageUrl; page++) {
    const doc = await fetchDoc(pageUrl, true);
    const links = [...doc.querySelectorAll("a[href]")];
    for (const a of links) {
      const href = a.getAttribute("href") || "";
      const m = href.match(new RegExp("^/chapter/" + bookId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/([^/]+)\\.html$"));
      if (!m || /^\d+$/.test(m[1])) continue;
      const text = (a.textContent || "").trim();
      if (!text || text === "上一页" || text === "下一页") continue;
      const abs = BASE + href;
      if (seen.has(abs)) continue;
      seen.add(abs);
      chapters.push({ title: text, url: abs, body: null });
    }
    const next = links.find(a => (a.textContent || "").trim() === "下一页");
    pageUrl = next ? (new URL(next.getAttribute("href"), BASE).toString()) : null;
  }
  if (!chapters.length) throw new Error("目录为空");
}
async function loadKudushuCatalog(){
  setMeta(paramTitle || "苦读书小说", paramAuthor || "");
  let dirUrl = dirParam;
  const m = bookUrl.match(/\/book\/info\/(\d+)\/(\d+)\.html/);
  if (!dirUrl && m) dirUrl = "http://www.kudushu.org/html/" + m[1] + "/" + m[2] + "/index.html";
  if (!dirUrl) throw new Error("书页链接无效");
  const doc = await fetchDoc(dirUrl, true);
  const seen = new Set();
  [...doc.querySelectorAll("a[href]")].forEach(a => {
    const abs = absUrl(a.getAttribute("href") || "", dirUrl);
    if (!/^https?:\/\/www\.kudushu\.org\/html\/\d+\/\d+\/\d+\.html$/.test(abs)) return;
    const text = (a.textContent || "").trim();
    if (!text || seen.has(abs)) return;
    seen.add(abs);
    chapters.push({ title: text, url: abs, body: null });
  });
  if (!chapters.length) throw new Error("目录为空");
}
async function loadSuduguuCatalog(){
  setMeta(paramTitle || "速读谷小说", paramAuthor || "");
  const seen = new Set();
  let pageUrl = bookUrl;
  for (let page = 0; page < 30 && pageUrl; page++) {
    const doc = await fetchDoc(pageUrl, true);
    const list = doc.querySelector("#list");
    const anchors = list ? [...list.querySelectorAll("a[href]")] : [...doc.querySelectorAll("a[href]")];
    anchors.forEach(a => {
      const abs = absUrl(a.getAttribute("href") || "", pageUrl);
      if (!/^https:\/\/www\.suduguu\.com\/\d+\/\d+\.html$/.test(abs)) return;
      const text = (a.textContent || "").trim();
      if (!text || text === "开始阅读" || seen.has(abs)) return;
      seen.add(abs);
      chapters.push({ title: text, url: abs, body: null });
    });
    const next = [...doc.querySelectorAll("a")].find(a => (a.textContent || "").trim() === "下一页");
    pageUrl = next ? absUrl(next.getAttribute("href"), pageUrl) : "";
  }
  if (!chapters.length) throw new Error("目录为空");
}
async function loadBookskyCatalog(){
  setMeta(paramTitle || "快眼小说", paramAuthor || "");
  const doc = await fetchDoc(bookUrl, true);
  const scope = doc.querySelector(".fulldir");
  const anchors = scope ? [...scope.querySelectorAll("a[href]")] : [...doc.querySelectorAll("a[href]")];
  const rows = [];
  anchors.forEach(a => {
    const abs = absUrl(a.getAttribute("href") || "", bookUrl);
    const mm = abs.match(/^https?:\/\/www\.xbotaodz\.info\/novel\/\d+\/read_(\d+)\.html$/);
    if (!mm) return;
    const text = (a.textContent || "").trim();
    if (!text) return;
    rows.push({ n: +mm[1], title: text, url: abs });
  });
  rows.sort((a, b) => a.n - b.n);
  const seen = new Set();
  rows.forEach(r => {
    if (seen.has(r.url)) return;
    seen.add(r.url);
    chapters.push({ title: r.title, url: r.url, body: null });
  });
  if (!chapters.length) throw new Error("目录为空");
}
async function loadPinshuzhaiCatalog(){
  setMeta(paramTitle || "品书斋小说", paramAuthor || "");
  const doc = await fetchDoc(bookUrl, true);
  const scope = doc.querySelector(".zjlist");
  const anchors = scope ? [...scope.querySelectorAll("a[href]")] : [...doc.querySelectorAll("a[href]")];
  const seen = new Set();
  anchors.forEach(a => {
    const abs = absUrl(a.getAttribute("href") || "", bookUrl);
    if (!/^https:\/\/www\.pinshuzhai\.com\/chapter\/\S+$/.test(abs)) return;
    const text = (a.textContent || "").trim();
    if (!text || seen.has(abs)) return;
    seen.add(abs);
    chapters.push({ title: text, url: abs, body: null });
  });
  if (!chapters.length) throw new Error("目录为空");
}
async function loadCatalog(){
  if (site === "sto66") return loadSto66Catalog();
  if (site === "kudushu") return loadKudushuCatalog();
  if (site === "suduguu") return loadSuduguuCatalog();
  if (site === "booksky") return loadBookskyCatalog();
  if (site === "pinshuzhai") return loadPinshuzhaiCatalog();
  throw new Error("书源不支持");
}
function renderChapter(){
  const c = chapters[cur];
  mainEl.innerHTML = "";
  const sec = document.createElement("section");
  sec.className = "chapter";
  const h2 = document.createElement("h2"); h2.textContent = c.title;
  sec.appendChild(h2);
  (c.body || []).forEach(t => {
    const p = document.createElement("p"); p.textContent = t; sec.appendChild(p);
  });
  mainEl.appendChild(sec);
  document.querySelectorAll(".toc-item").forEach((t, j) => t.classList.toggle("active", j === cur));
  document.getElementById("prevBtn").disabled = cur === 0;
  document.getElementById("nextBtn").disabled = cur === chapters.length - 1;
  window.scrollTo({ top: 0 });
  apply(); save();
}
async function loadChapterBody(c){
  if (site === "sto66") {
    const doc = await fetchDoc(c.url, true);
    const box = doc.querySelector("#content.readcontent") || doc.querySelector("#content");
    if (!box) throw new Error("正文解析失败");
    const paras = [...box.querySelectorAll("p")].map(p => p.textContent.trim()).filter(Boolean);
    c.body = paras.length ? paras : box.textContent.split("\n").map(s => s.trim()).filter(Boolean);
    if (!c.body.length) throw new Error("正文为空");
    return;
  }
  if (site === "kudushu") {
    const doc = await fetchDoc(c.url, true);
    c.body = extractParas(doc.querySelector("#content"), /www\.kudushu\.org/);
  } else if (site === "suduguu") {
    const parts = [];
    let u = c.url;
    for (let i = 0; i < 30 && u; i++) {
      const doc = await fetchDoc(u, true);
      const boxes = [...doc.querySelectorAll(".con")];
      let box = boxes[0] || null;
      boxes.forEach(b => {
        if ((b.textContent || "").trim().length > ((box && box.textContent || "").trim().length)) box = b;
      });
      parts.push(...extractParas(box));
      const next = [...doc.querySelectorAll("a")].find(a => (a.textContent || "").trim() === "下一页");
      u = next ? absUrl(next.getAttribute("href"), u) : "";
    }
    if (parts.length && parts[0].startsWith(c.title)) {
      parts[0] = parts[0].slice(c.title.length).trim();
      if (!parts[0]) parts.shift();
    }
    c.body = parts;
  } else if (site === "booksky") {
    const doc = await fetchDoc(c.url, true);
    c.body = extractParas(doc.querySelector("#chaptercontent"), /最新网址|xbotaodz\.info/);
  } else if (site === "pinshuzhai") {
    const doc = await fetchDoc(c.url, true);
    const box = doc.querySelector(".chapterbox") || doc.querySelector(".chapterbo") || doc.querySelector("article.shid") || longestTextEl(doc.querySelector("#chapter"));
    c.body = extractParas(box, /pinshuzhai\.com|章节列表|^(上一章|下一章)$/);
    if (c.body.length && c.body[0].startsWith("品书斋")) {
      c.body[0] = c.body[0].slice(3).trim();
      if (!c.body[0]) c.body.shift();
    }
  } else {
    throw new Error("书源不支持");
  }
  if (!c.body.length) throw new Error("正文为空");
}
async function show(i){
  cur = Math.min(Math.max(i, 0), chapters.length - 1);
  const c = chapters[cur];
  if (!c.body) {
    mainEl.innerHTML = "";
    const p = document.createElement("p"); p.className = "status"; p.textContent = "正在加载「" + c.title + "」…";
    mainEl.appendChild(p);
    try {
      await loadChapterBody(c);
    } catch (e) {
      mainEl.innerHTML = "";
      const p = document.createElement("p"); p.className = "status";
      p.textContent = "本章加载失败（" + (e.message || e) + "），可去" + sourceLabel + "读本章。";
      mainEl.appendChild(p);
      return;
    }
  }
  renderChapter();
}
function closeToc(){
  document.getElementById("toc").classList.remove("open");
  document.getElementById("mask").classList.remove("show");
}
document.getElementById("tocBtn").onclick = () => {
  document.getElementById("toc").classList.add("open");
  document.getElementById("mask").classList.add("show");
};
document.getElementById("mask").onclick = closeToc;
document.getElementById("prevBtn").onclick = () => show(cur - 1);
document.getElementById("nextBtn").onclick = () => show(cur + 1);
document.getElementById("fontMinus").onclick = () => { fontSize = Math.max(14, fontSize - 1); apply(); save(); };
document.getElementById("fontPlus").onclick = () => { fontSize = Math.min(26, fontSize + 1); apply(); save(); };
document.getElementById("lineBtn").onclick = () => { lineH = lineH >= 2.2 ? 1.6 : +(lineH + 0.15).toFixed(2); apply(); save(); };
document.getElementById("nightBtn").onclick = () => { document.body.classList.toggle("night"); apply(); save(); };
loadCatalog().then(() => {
  document.getElementById("tocTitle").textContent = "目录（共 " + chapters.length + " 章）";
  const tocList = document.getElementById("tocList");
  chapters.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "toc-item"; b.dataset.ch = i; b.textContent = c.title;
    b.onclick = () => { show(i); closeToc(); };
    tocList.appendChild(b);
  });
  if (cur >= chapters.length) cur = 0;
  statusEl.remove(); show(cur); apply();
}).catch(e => { document.getElementById("bookTitle").textContent = "加载失败"; fail("目录加载失败（" + (e.message || e) + "）。"); });
})();
</script>

</body></html>
