<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小说阅读页</title>
<style>
:root{--bg:#ffffff;--fg:#000000;--muted:#8a8a8e;--line:#c6c6c8;--accent:#007aff;--card:#ffffff;--bar:#ffffff;--track:#e5e5ea;--sheet:#f2f2f7;--seg:#e5e5ea}
body[data-theme="white"]{--bg:#ffffff;--fg:#000000;--muted:#8a8a8e;--line:#c6c6c8;--accent:#007aff;--card:#ffffff;--bar:#ffffff;--track:#e5e5ea;--sheet:#f2f2f7;--seg:#e5e5ea}
body[data-theme="paper"]{--bg:#f7f1e3;--fg:#1c1c1e;--muted:#8a8a8e;--line:#e6dcc8;--accent:#007aff;--card:#fffdf8;--bar:#fffdf8;--track:#e6dcc8;--sheet:#efe8d8;--seg:#e6dcc8}
body[data-theme="green"]{--bg:#e6f0df;--fg:#1c1c1e;--muted:#8a8a8e;--line:#c2d4b4;--accent:#007aff;--card:#eef5e9;--bar:#eef5e9;--track:#c2d4b4;--sheet:#ddebd2;--seg:#c2d4b4}
body[data-theme="pink"]{--bg:#fdf0ef;--fg:#1c1c1e;--muted:#8a8a8e;--line:#f0d2cd;--accent:#007aff;--card:#fef6f5;--bar:#fef6f5;--track:#f0d2cd;--sheet:#f9e2de;--seg:#f0d2cd}
body[data-theme="blue"]{--bg:#eef3f8;--fg:#1c1c1e;--muted:#8a8a8e;--line:#cbd6e2;--accent:#007aff;--card:#f4f8fb;--bar:#f4f8fb;--track:#cbd6e2;--sheet:#e2eaf2;--seg:#cbd6e2}
body.night{--bg:#000000;--fg:#ebebf5;--muted:#8e8e93;--line:#38383a;--accent:#0a84ff;--card:#1c1c1e;--bar:#1c1c1e;--track:#2c2c2e;--sheet:#1c1c1e;--seg:#2c2c2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body.serif #content{font-family:Georgia,"Songti SC","STSong","SimSun",serif}
/* 亮度遮罩：盖在内容上、菜单之下，调亮度时菜单保持清晰 */
#dimOverlay{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
/* 顶部导航：平时藏起，点屏幕才滑出 */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bar);background:color-mix(in srgb,var(--bar) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--line);transform:translateY(-105%);transition:transform .28s ease}
body.chrome #topbar{transform:none}
#topbar button{background:transparent;border:0;color:var(--accent);font-size:17px;padding:6px 4px}
#topbar h1{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 正文：书页式排版，居中窄栏 */
main{max-width:680px;margin:0 auto;padding:32px 22px 0}
.runhead{font-size:13px;color:var(--muted);margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter h2{font-size:24px;font-weight:700;line-height:1.35;margin:0 0 22px;letter-spacing:-.01em}
.chapter p{line-height:1.9;margin:0 0 1em;text-align:justify}
.endnav{margin:44px 0 8px;padding-top:20px;border-top:.5px solid var(--line);text-align:center}
.endnav button{background:transparent;border:0;color:var(--accent);font-size:17px;padding:12px 20px}
.endnav .done{color:var(--muted);font-size:14px;margin:0 0 4px}
/* 底部菜单：进度滑块 + 上一章/进度/下一章，平时藏起 */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--bar);background:color-mix(in srgb,var(--bar) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease}
body.chrome #bottombar{transform:none}
#chapterSlider{width:100%;margin:0 0 12px}
.barrow{display:flex;align-items:center;gap:8px}
.barrow button{background:transparent;border:0;color:var(--accent);font-size:16px;padding:8px 10px}
.barrow button:disabled{color:var(--muted);opacity:.6}
.barrow span{flex:1;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap}
/* 滑块：iOS 风格细轨 + 白圆钮 */
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--track);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* 设置面板：底部弹出卡片 */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:150}
#backdrop.show{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--sheet);border-radius:16px 16px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s ease}
#sheet.open{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--muted);opacity:.5;margin:2px auto 10px}
.sheethead{display:flex;align-items:center;margin-bottom:14px}
.sheethead h2{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0}
.sheethead button{background:transparent;border:0;color:var(--accent);font-size:17px;padding:6px 4px}
.sec{margin-bottom:18px}
.sec h3{font-size:13px;font-weight:400;color:var(--muted);margin:0 0 8px;padding-left:4px}
.group{background:var(--card);border-radius:12px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .label{font-size:16px;flex:0 0 auto}
.row input[type=range]{flex:1}
.row .val{font-size:14px;color:var(--muted);min-width:44px;text-align:right}
.row a{color:var(--accent);text-decoration:none;font-size:16px;flex:1}
.row .chev{color:var(--muted);font-size:18px}
/* 分段选择：iOS 风格 */
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);font-size:14px;padding:7px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
/* 开关：iOS 风格 */
.switch{position:relative;width:51px;height:31px;flex:0 0 auto;-webkit-appearance:none;appearance:none;background:var(--track);border-radius:16px;outline:none;transition:background .2s}
.switch:checked{background:#34c759}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch:checked::after{left:22px}
/* 主题圆点 */
.themes{display:flex;gap:12px;flex:1;justify-content:space-between;padding:6px 0}
.theme-dot{width:30px;height:30px;border-radius:50%;border:.5px solid var(--line);padding:0;cursor:pointer}
.theme-dot.active{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
/* 全屏目录：整页滑出，带搜索 */
#catalog{position:fixed;inset:0;z-index:200;background:var(--bg);transform:translateY(100%);transition:transform .3s ease;display:flex;flex-direction:column}
#catalog.open{transform:none}
.cathead{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:var(--bar);background:color-mix(in srgb,var(--bar) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--line)}
.cathead .top{display:flex;align-items:center;margin-bottom:10px}
.cathead .top button{background:transparent;border:0;color:var(--accent);font-size:17px;padding:6px 4px}
.cathead .top h2{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0}
.cathead input{width:100%;border:0;border-radius:10px;background:var(--seg);color:var(--fg);font-size:16px;padding:9px 12px;outline:none}
.cathead input::placeholder{color:var(--muted)}
#tocList{flex:1;overflow-y:auto}
.toc-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:.5px solid var(--line);color:var(--fg);padding:13px 18px;font-size:16px;line-height:1.5}
.toc-item.active{color:var(--accent);font-weight:600}
/* 状态与说明 */
.status{color:var(--muted);font-size:14px;line-height:1.8;text-align:center;padding:60px 0}
.alt-btn{background:var(--accent);border:0;color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;margin:6px}
.status .retry{background:var(--accent);border:0;color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;font-weight:600}
.status a{color:var(--accent);text-decoration:none}
.footnote{max-width:680px;margin:0 auto;padding:24px 20px calc(140px + env(safe-area-inset-bottom));color:var(--muted);font-size:12px;line-height:1.8;text-align:center}
.footnote a{color:var(--accent);text-decoration:none}
</style></head>
<body>
<div id="dimOverlay"></div>
<nav id="topbar"><button id="topTocBtn">目录</button><h1 id="bookTitle">加载中…</h1><button id="aaBtn">Aa</button></nav>
<main id="content"><p class="status" id="statusText">正在加载目录…</p></main>
<p class="footnote">内容由源站提供，本页仅做排版呈现（正文不经过机器人服务器存储）。若加载失败，可点屏幕调出菜单、进设置点「在原站打开」。</p>
<nav id="bottombar">
<input type="range" id="chapterSlider" min="0" max="0" value="0" step="1">
<div class="barrow"><button id="prevBtn" disabled>‹ 上一章</button><span id="progressText">-- / --</span><button id="nextBtn" disabled>下一章 ›</button></div>
</nav>
<div id="backdrop"></div>
<section id="sheet">
<div class="grabber"></div>
<div class="sheethead"><span style="width:44px"></span><h2>设置</h2><button id="sheetDone">完成</button></div>
<div class="sec"><h3>字号</h3><div class="group"><div class="row">
<button id="fontMinus" style="background:transparent;border:0;color:var(--accent);font-size:17px;padding:6px 8px">A-</button>
<input type="range" id="fontRange" min="14" max="26" step="1" value="19">
<button id="fontPlus" style="background:transparent;border:0;color:var(--accent);font-size:17px;padding:6px 8px">A+</button>
<span class="val" id="fontVal">19</span>
</div></div></div>
<div class="sec"><h3>行距</h3><div class="group"><div class="row"><div class="seg" id="lineSeg">
<button data-line="1.6">紧凑</button><button data-line="1.9" class="on">适中</button><button data-line="2.2">宽松</button>
</div></div></div></div>
<div class="sec"><h3>字体</h3><div class="group"><div class="row"><div class="seg" id="fontSeg">
<button data-font="sans" class="on">系统</button><button data-font="serif">衬线</button>
</div></div></div></div>
<div class="sec"><h3>主题</h3><div class="group"><div class="row"><div class="themes">
<button class="theme-dot" data-theme="white" style="background:#ffffff" aria-label="白色"></button>
<button class="theme-dot" data-theme="paper" style="background:#f7f1e3" aria-label="米色"></button>
<button class="theme-dot" data-theme="green" style="background:#d9e8cf" aria-label="护眼绿"></button>
<button class="theme-dot" data-theme="pink" style="background:#fce9e6" aria-label="粉色"></button>
<button class="theme-dot" data-theme="blue" style="background:#e3eaf2" aria-label="浅蓝"></button>
</div></div></div></div>
<div class="sec"><h3>外观</h3><div class="group">
<div class="row"><span class="label">夜间模式</span><input type="checkbox" class="switch" id="nightSwitch" style="margin-left:auto"></div>
<div class="row"><span class="label">亮度</span><input type="range" id="brightRange" min="40" max="100" step="1" value="100"><span class="val" id="brightVal">100%</span></div>
</div></div>
<div class="sec"><h3>来源</h3><div class="group"><div class="row"><a id="sourceLink" href="#" target="_blank" rel="noopener">原站</a><span class="chev">›</span></div></div></div>
</section>
<section id="catalog">
<div class="cathead"><div class="top"><button id="catalogClose">关闭</button><h2 id="tocTitle">目录</h2><span style="width:44px"></span></div>
<input id="catalogSearch" type="search" placeholder="搜索章节" enterkeyhint="search"></div>
<div id="tocList"></div>
</section>
<script>
(function(){
const params = new URLSearchParams(location.search);
const site = params.get("site") || "";
const bookId = params.get("id") || "";
const bookUrl = params.get("url") || "";
const dirParam = params.get("dir") || "";
const paramTitle = params.get("title") || "";
const paramAuthor = params.get("author") || "";
const WORKER = "https://book-proxy.qqbookproxy.workers.dev/";
const SITE_NAMES = { sto66: "思兔", kudushu: "苦读书", suduguu: "速读谷", booksky: "快眼", pinshuzhai: "品书斋" };
const SITE_HOSTS = { kudushu: ["www.kudushu.org"], suduguu: ["www.suduguu.com"], booksky: ["www.xbotaodz.info"], pinshuzhai: ["www.pinshuzhai.com"] };
// 同书他站备用（机器人选书时附在链接 alt 参数里，JSON）：目录加载失败时一键换站续读同一本
const alts = params.getAll("alt").map((x) => { try { const o = JSON.parse(x); return (o && SITE_NAMES[o.site]) ? o : null; } catch (e) { return null; } }).filter(Boolean)
  .filter((o) => o.site !== site && (o.site === "sto66" ? !!o.id : !!o.url));
function altReaderUrl(alt) {
  const qp = new URLSearchParams();
  qp.set("site", alt.site);
  if (alt.site === "sto66") qp.set("id", alt.id);
  else {
    qp.set("url", alt.url);
    if (alt.dir) qp.set("dir", alt.dir);
  }
  if (alt.title) qp.set("title", alt.title);
  if (alt.author) qp.set("author", alt.author);
  // 其余备用（含当前这本，方便再切回来）一并带上
  const rest = [{ site, id: bookId || undefined, url: bookUrl || undefined, dir: dirParam || undefined, title: paramTitle || undefined, author: paramAuthor || undefined }];
  Object.keys(rest[0]).forEach(k => rest[0][k] === undefined && delete rest[0][k]);
  alts.forEach((o) => { if (o.site !== alt.site) rest.push(o); });
  rest.forEach((o) => qp.append("alt", JSON.stringify(o)));
  return WORKER + "?" + qp.toString();
}
const statusEl = document.getElementById("statusText");
const mainEl = document.getElementById("content");
const sourceLinkEl = document.getElementById("sourceLink");
const footnoteEl = document.querySelector(".footnote");
let sourceUrl = "", sourceLabel = "原站";
let curTitle = "", curAuthor = "";
function fail(msg){
  statusEl.innerHTML = "";
  const p = document.createElement("p"); p.className = "status"; p.textContent = msg + " ";
  const retry = document.createElement("button"); retry.className = "retry"; retry.textContent = "重试";
  retry.onclick = () => location.reload();
  p.appendChild(retry);
  if (sourceUrl) {
    p.appendChild(document.createTextNode(" "));
    const src = document.createElement("a"); src.href = sourceUrl;
    src.target = "_blank"; src.rel = "noopener"; src.textContent = "去" + sourceLabel + "读";
    p.appendChild(src);
  }
  statusEl.appendChild(p);
}
if (!SITE_NAMES[site]) {
  document.getElementById("bookTitle").textContent = "链接无效";
  fail("这条链接的书源不支持，请回机器人重新搜书。");
  return;
}
if (site === "sto66") {
  if (!/^[A-Za-z0-9]+$/.test(bookId)) {
    document.getElementById("bookTitle").textContent = "链接无效";
    fail("这条链接只支持思兔（site=sto66），请回机器人重新搜书。");
    return;
  }
  sourceUrl = "https://www.sto66.com/book/" + bookId + ".html";
  sourceLabel = "思兔原站";
} else {
  let ok = false;
  try {
    const u = new URL(bookUrl);
    ok = /^https?:$/.test(u.protocol) && (SITE_HOSTS[site] || []).includes(u.hostname);
  } catch (e) { ok = false; }
  if (!ok) {
    document.getElementById("bookTitle").textContent = "链接无效";
    fail("这条链接的书页地址无效，请回机器人重新搜书。");
    return;
  }
  sourceUrl = bookUrl;
  sourceLabel = SITE_NAMES[site] + "原站";
}
sourceLinkEl.href = sourceUrl;
sourceLinkEl.textContent = sourceLabel + " ›";
if (footnoteEl) {
  footnoteEl.textContent = site === "sto66"
    ? "内容由思兔阅读提供，本页经中转 Worker 取源站内容排版呈现（正文不经过机器人服务器存储）。若加载失败，可点屏幕调出菜单、进设置点「思兔原站」直接在源站阅读。"
    : "内容由" + SITE_NAMES[site] + "提供，本页经中转 Worker 取源站内容排版呈现（正文不经过机器人服务器存储）。若加载失败，可点屏幕调出菜单、进设置点「" + sourceLabel + "」直接在源站阅读。";
}
statusEl.textContent = "正在从" + SITE_NAMES[site] + "加载目录…";
function hashStr(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const KEY = site === "sto66" ? "novel-sto66-" + bookId + "-progress" : "novel-" + site + "-" + hashStr(bookUrl) + "-progress";
let chapters = [];
let cur = 0, fontSize = 19, lineH = 1.9, fontFamily = "sans", brightness = 100;
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) {
    fontSize = saved.fontSize || 19; lineH = saved.lineH || 1.9;
    fontFamily = saved.fontFamily === "serif" ? "serif" : "sans";
    brightness = (typeof saved.brightness === "number" && saved.brightness >= 40 && saved.brightness <= 100) ? saved.brightness : 100;
    if (saved.night) document.body.classList.add("night");
    if (Number.isInteger(saved.chapter)) cur = saved.chapter;
  }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({chapter: cur, fontSize, lineH, night: document.body.classList.contains("night"), fontFamily, brightness})); } catch (e) {} }
function apply(){
  mainEl.style.fontSize = fontSize + "px";
  mainEl.querySelectorAll(".chapter p").forEach(p => p.style.lineHeight = lineH);
  document.body.classList.toggle("serif", fontFamily === "serif");
  document.getElementById("dimOverlay").style.opacity = ((100 - brightness) / 100 * 0.7).toFixed(3);
  const fr = document.getElementById("fontRange");
  if (fr) fr.value = fontSize;
  const fv = document.getElementById("fontVal");
  if (fv) fv.textContent = fontSize;
  document.querySelectorAll("#lineSeg button").forEach(b => b.classList.toggle("on", +b.dataset.line === lineH));
  document.querySelectorAll("#fontSeg button").forEach(b => b.classList.toggle("on", b.dataset.font === fontFamily));
  const ns = document.getElementById("nightSwitch");
  if (ns) ns.checked = document.body.classList.contains("night");
  const br = document.getElementById("brightRange");
  if (br) br.value = brightness;
  const bv = document.getElementById("brightVal");
  if (bv) bv.textContent = brightness + "%";
}
function esc(s){ return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
async function fetchDoc(url, viaWorker){
  const target = viaWorker ? WORKER + "?u=" + encodeURIComponent(url) : url;
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(target, { headers: { "Accept": "text/html" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const html = await res.text();
      return new DOMParser().parseFromString(html, "text/html");
    } catch (e) {
      lastErr = e;
      if (attempt < 2) await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
    }
  }
  throw lastErr;
}
function absUrl(href, base){
  try { return new URL(href, base).toString(); } catch (e) { return ""; }
}
function extractParas(box, dropRe){
  if (!box) throw new Error("正文解析失败");
  const ps = [...box.querySelectorAll("p")].map(p => p.textContent.trim()).filter(Boolean);
  let out = ps;
  if (!out.length) {
    const lines = [];
    let curLine = "";
    const walk = (node) => {
      if (node.nodeType === 3) curLine += node.textContent;
      else if (node.nodeName === "BR") { lines.push(curLine); curLine = ""; }
      else node.childNodes.forEach(walk);
    };
    box.childNodes.forEach(walk);
    if (curLine) lines.push(curLine);
    out = lines.map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  }
  if (dropRe) out = out.filter(s => !dropRe.test(s));
  return out;
}
function longestTextEl(root){
  let best = null, bestLen = 0;
  if (!root) return null;
  root.querySelectorAll("div, article").forEach(el => {
    const len = (el.textContent || "").trim().length;
    if (len > bestLen) { bestLen = len; best = el; }
  });
  return bestLen > 500 ? best : null;
}
function parseTitleAuthor(doc, rawHtml){
  let title = "", author = "";
  const t = (doc.title || "").split("-")[0] || "";
  const pm = t.match(/^(.*?)\(([^)]+)\)\s*$/);
  if (pm) { title = pm[1].trim(); author = pm[2].trim(); }
  else if (t) { title = t.replace(/全文免费阅读.*$/, "").trim(); }
  if (!author) {
    const am = rawHtml.match(/作者：([^<\n]{1,30})/);
    if (am) author = am[1].trim();
  }
  return { title: title || "思兔小说", author: author || "" };
}
function setMeta(title, author){
  curTitle = title; curAuthor = author;
  document.getElementById("bookTitle").textContent = title;
  document.title = title + " - 小说阅读页";
}
async function loadSto66Catalog(){
  const BASE = "https://www.sto66.com";
  const bookDoc = await fetchDoc(BASE + "/book/" + bookId + ".html", true);
  const raw = bookDoc.documentElement.outerHTML;
  const meta = parseTitleAuthor(bookDoc, raw);
  setMeta(meta.title, meta.author);
  const seen = new Set();
  let pageUrl = BASE + "/chapter/" + bookId + ".html";
  for (let page = 0; page < 30 && pageUrl; page++) {
    const doc = await fetchDoc(pageUrl, true);
    const links = [...doc.querySelectorAll("a[href]")];
    for (const a of links) {
      const href = a.getAttribute("href") || "";
      const m = href.match(new RegExp("^/chapter/" + bookId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/([^/]+)\\.html$"));
      if (!m || /^\d+$/.test(m[1])) continue;
      const text = (a.textContent || "").trim();
      if (!text || text === "上一页" || text === "下一页") continue;
      const abs = BASE + href;
      if (seen.has(abs)) continue;
      seen.add(abs);
      chapters.push({ title: text, url: abs, body: null });
    }
    const next = links.find(a => (a.textContent || "").trim() === "下一页");
    pageUrl = next ? (new URL(next.getAttribute("href"), BASE).toString()) : null;
  }
  if (!chapters.length) throw new Error("目录为空");
}
async function loadKudushuCatalog(){
  setMeta(paramTitle || "苦读书小说", paramAuthor || "");
  let dirUrl = dirParam;
  const m = bookUrl.match(/\/book\/info\/(\d+)\/(\d+)\.html/);
  if (!dirUrl && m) dirUrl = "http://www.kudushu.org/html/" + m[1] + "/" + m[2] + "/index.html";
  if (!dirUrl) throw new Error("书页链接无效");
  const doc = await fetchDoc(dirUrl, true);
  const seen = new Set();
  [...doc.querySelectorAll("a[href]")].forEach(a => {
    const abs = absUrl(a.getAttribute("href") || "", dirUrl);
    if (!/^https?:\/\/www\.kudushu\.org\/html\/\d+\/\d+\/\d+\.html$/.test(abs)) return;
    const text = (a.textContent || "").trim();
    if (!text || seen.has(abs)) return;
    seen.add(abs);
    chapters.push({ title: text, url: abs, body: null });
  });
  if (!chapters.length) throw new Error("目录为空");
}
async function loadSuduguuCatalog(){
  setMeta(paramTitle || "速读谷小说", paramAuthor || "");
  const seen = new Set();
  let pageUrl = bookUrl;
  for (let page = 0; page < 30 && pageUrl; page++) {
    const doc = await fetchDoc(pageUrl, true);
    const list = doc.querySelector("#list");
    const anchors = list ? [...list.querySelectorAll("a[href]")] : [...doc.querySelectorAll("a[href]")];
    anchors.forEach(a => {
      const abs = absUrl(a.getAttribute("href") || "", pageUrl);
      if (!/^https:\/\/www\.suduguu\.com\/\d+\/\d+\.html$/.test(abs)) return;
      const text = (a.textContent || "").trim();
      if (!text || text === "开始阅读" || seen.has(abs)) return;
      seen.add(abs);
      chapters.push({ title: text, url: abs, body: null });
    });
    const next = [...doc.querySelectorAll("a")].find(a => (a.textContent || "").trim() === "下一页");
    pageUrl = next ? absUrl(next.getAttribute("href"), pageUrl) : "";
  }
  if (!chapters.length) throw new Error("目录为空");
}
async function loadBookskyCatalog(){
  setMeta(paramTitle || "快眼小说", paramAuthor || "");
  const doc = await fetchDoc(bookUrl, true);
  const scope = doc.querySelector(".fulldir");
  const anchors = scope ? [...scope.querySelectorAll("a[href]")] : [...doc.querySelectorAll("a[href]")];
  const rows = [];
  anchors.forEach(a => {
    const abs = absUrl(a.getAttribute("href") || "", bookUrl);
    const mm = abs.match(/^https?:\/\/www\.xbotaodz\.info\/novel\/\d+\/read_(\d+)\.html$/);
    if (!mm) return;
    const text = (a.textContent || "").trim();
    if (!text) return;
    rows.push({ n: +mm[1], title: text, url: abs });
  });
  rows.sort((a, b) => a.n - b.n);
  const seen = new Set();
  rows.forEach(r => {
    if (seen.has(r.url)) return;
    seen.add(r.url);
    chapters.push({ title: r.title, url: r.url, body: null });
  });
  if (!chapters.length) throw new Error("目录为空");
}
async function loadPinshuzhaiCatalog(){
  setMeta(paramTitle || "品书斋小说", paramAuthor || "");
  const doc = await fetchDoc(bookUrl, true);
  const scope = doc.querySelector(".zjlist");
  const anchors = scope ? [...scope.querySelectorAll("a[href]")] : [...doc.querySelectorAll("a[href]")];
  const seen = new Set();
  anchors.forEach(a => {
    const abs = absUrl(a.getAttribute("href") || "", bookUrl);
    if (!/^https:\/\/www\.pinshuzhai\.com\/chapter\/\S+$/.test(abs)) return;
    const text = (a.textContent || "").trim();
    if (!text || seen.has(abs)) return;
    seen.add(abs);
    chapters.push({ title: text, url: abs, body: null });
  });
  if (!chapters.length) throw new Error("目录为空");
}
async function loadCatalog(){
  if (site === "sto66") return loadSto66Catalog();
  if (site === "kudushu") return loadKudushuCatalog();
  if (site === "suduguu") return loadSuduguuCatalog();
  if (site === "booksky") return loadBookskyCatalog();
  if (site === "pinshuzhai") return loadPinshuzhaiCatalog();
  throw new Error("书源不支持");
}
function renderChapter(){
  const c = chapters[cur];
  mainEl.innerHTML = "";
  const sec = document.createElement("section");
  sec.className = "chapter";
  const head = document.createElement("p");
  head.className = "runhead";
  head.textContent = curTitle + (curAuthor ? " · " + curAuthor : "");
  sec.appendChild(head);
  const h2 = document.createElement("h2"); h2.textContent = c.title;
  sec.appendChild(h2);
  (c.body || []).forEach(t => {
    const p = document.createElement("p"); p.textContent = t; sec.appendChild(p);
  });
  mainEl.appendChild(sec);
  const end = document.createElement("div");
  end.className = "endnav";
  if (cur < chapters.length - 1) {
    const nb = document.createElement("button");
    nb.textContent = "下一章 ›";
    nb.onclick = () => show(cur + 1);
    end.appendChild(nb);
  } else {
    const d = document.createElement("p");
    d.className = "done"; d.textContent = "已是最后一章";
    end.appendChild(d);
    const tb = document.createElement("button");
    tb.textContent = "返回目录";
    tb.onclick = openCatalog;
    end.appendChild(tb);
  }
  mainEl.appendChild(end);
  document.querySelectorAll(".toc-item").forEach((t, j) => t.classList.toggle("active", j === cur));
  document.getElementById("prevBtn").disabled = cur === 0;
  document.getElementById("nextBtn").disabled = cur === chapters.length - 1;
  const prog = document.getElementById("progressText");
  if (prog) prog.textContent = "第 " + (cur + 1) + " / " + chapters.length + " 章 · " + (chapters.length ? Math.round((cur + 1) / chapters.length * 100) : 0) + "%";
  const slider = document.getElementById("chapterSlider");
  if (slider) { slider.max = Math.max(0, chapters.length - 1); slider.value = cur; }
  window.scrollTo({ top: 0 });
  apply(); save();
}
async function loadChapterBody(c){
  if (site === "sto66") {
    const doc = await fetchDoc(c.url, true);
    const box = doc.querySelector("#content.readcontent") || doc.querySelector("#content");
    if (!box) throw new Error("正文解析失败");
    const paras = [...box.querySelectorAll("p")].map(p => p.textContent.trim()).filter(Boolean);
    c.body = paras.length ? paras : box.textContent.split("\n").map(s => s.trim()).filter(Boolean);
    if (!c.body.length) throw new Error("正文为空");
    return;
  }
  if (site === "kudushu") {
    const doc = await fetchDoc(c.url, true);
    c.body = extractParas(doc.querySelector("#content"), /www\.kudushu\.org/);
  } else if (site === "suduguu") {
    const parts = [];
    let u = c.url;
    for (let i = 0; i < 30 && u; i++) {
      const doc = await fetchDoc(u, true);
      const boxes = [...doc.querySelectorAll(".con")];
      let box = boxes[0] || null;
      boxes.forEach(b => {
        if ((b.textContent || "").trim().length > ((box && box.textContent || "").trim().length)) box = b;
      });
      parts.push(...extractParas(box));
      const next = [...doc.querySelectorAll("a")].find(a => (a.textContent || "").trim() === "下一页");
      u = next ? absUrl(next.getAttribute("href"), u) : "";
    }
    if (parts.length && parts[0].startsWith(c.title)) {
      parts[0] = parts[0].slice(c.title.length).trim();
      if (!parts[0]) parts.shift();
    }
    c.body = parts;
  } else if (site === "booksky") {
    const doc = await fetchDoc(c.url, true);
    c.body = extractParas(doc.querySelector("#chaptercontent"), /最新网址|xbotaodz\.info/);
  } else if (site === "pinshuzhai") {
    const doc = await fetchDoc(c.url, true);
    const box = doc.querySelector(".chapterbox") || doc.querySelector(".chapterbo") || doc.querySelector("article.shid") || longestTextEl(doc.querySelector("#chapter"));
    c.body = extractParas(box, /pinshuzhai\.com|章节列表|^(上一章|下一章)$/);
    if (c.body.length && c.body[0].startsWith("品书斋")) {
      c.body[0] = c.body[0].slice(3).trim();
      if (!c.body[0]) c.body.shift();
    }
  } else {
    throw new Error("书源不支持");
  }
  if (!c.body.length) throw new Error("正文为空");
}
async function show(i){
  cur = Math.min(Math.max(i, 0), chapters.length - 1);
  const c = chapters[cur];
  if (!c.body) {
    mainEl.innerHTML = "";
    const p = document.createElement("p"); p.className = "status"; p.textContent = "正在加载「" + c.title + "」…";
    mainEl.appendChild(p);
    try {
      await loadChapterBody(c);
    } catch (e) {
      mainEl.innerHTML = "";
      const p = document.createElement("p"); p.className = "status";
      p.textContent = "本章加载失败（" + (e.message || e) + "），可去" + sourceLabel + "读本章。";
      mainEl.appendChild(p);
      return;
    }
  }
  renderChapter();
}
// ── 菜单与面板（新 UI 层）──
// 点屏幕出/藏菜单：只认「短按且几乎没动」的轻点，滑动选字不触发
let downX = 0, downY = 0, downT = 0;
mainEl.addEventListener("pointerdown", (e) => { downX = e.clientX; downY = e.clientY; downT = Date.now(); });
mainEl.addEventListener("pointerup", (e) => {
  if (Date.now() - downT > 300) return;
  if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) return;
  if (e.target.closest("button, a, input")) return;
  if (document.getElementById("sheet").classList.contains("open")) { closeSheet(); return; }
  document.body.classList.toggle("chrome");
});
function openSheet(){
  document.getElementById("sheet").classList.add("open");
  document.getElementById("backdrop").classList.add("show");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("backdrop").classList.remove("show");
}
function openCatalog(){
  document.getElementById("catalog").classList.add("open");
}
function closeCatalog(){
  document.getElementById("catalog").classList.remove("open");
}
document.getElementById("topTocBtn").onclick = openCatalog;
document.getElementById("aaBtn").onclick = openSheet;
document.getElementById("sheetDone").onclick = closeSheet;
document.getElementById("backdrop").onclick = closeSheet;
document.getElementById("catalogClose").onclick = closeCatalog;

document.getElementById("prevBtn").onclick = () => show(cur - 1);
document.getElementById("nextBtn").onclick = () => show(cur + 1);
document.getElementById("fontMinus").onclick = () => { fontSize = Math.max(14, fontSize - 1); apply(); save(); };
document.getElementById("fontPlus").onclick = () => { fontSize = Math.min(26, fontSize + 1); apply(); save(); };

document.querySelectorAll("#lineSeg button").forEach(b => { b.onclick = () => { lineH = +b.dataset.line; apply(); save(); }; });
document.querySelectorAll("#fontSeg button").forEach(b => { b.onclick = () => { fontFamily = b.dataset.font; apply(); save(); }; });
document.getElementById("nightSwitch").addEventListener("change", (e) => { document.body.classList.toggle("night", e.target.checked); apply(); save(); });
document.getElementById("brightRange").addEventListener("input", (e) => { brightness = parseInt(e.target.value, 10) || 100; apply(); save(); });
// 主题切换：偏好存独立键 novel-theme2（默认白色），原有阅读进度对象不动
const themeDots = document.querySelectorAll(".theme-dot");
function applyTheme(t){
  document.body.dataset.theme = t;
  themeDots.forEach(d => d.classList.toggle("active", d.dataset.theme === t));
  try { localStorage.setItem("novel-theme2", t); } catch (e) {}
}
themeDots.forEach(d => { d.onclick = () => applyTheme(d.dataset.theme); });
let savedTheme = "white";
try { savedTheme = localStorage.getItem("novel-theme2") || "white"; } catch (e) {}
if (!["paper","white","green","pink","blue"].includes(savedTheme)) savedTheme = "white";
applyTheme(savedTheme);
loadCatalog().then(() => {
  document.getElementById("tocTitle").textContent = "目录（共 " + chapters.length + " 章）";
  const tocList = document.getElementById("tocList");
  chapters.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "toc-item"; b.dataset.ch = i; b.textContent = c.title;
    b.onclick = () => { show(i); closeCatalog(); document.body.classList.remove("chrome"); };
    tocList.appendChild(b);
  });
  if (cur >= chapters.length) cur = 0;
  statusEl.remove(); show(cur); apply();
}).catch(e => {
  document.getElementById("bookTitle").textContent = "加载失败";
  fail("目录加载失败（" + (e.message || e) + "）。");
  if (alts.length) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "margin-top:14px;text-align:center";
    const tip = document.createElement("p");
    tip.className = "status"; tip.style.padding = "0";
    tip.textContent = "当前站加载失败，换个站读同一本：";
    wrap.appendChild(tip);
    alts.forEach((o) => {
      const b = document.createElement("button");
      b.className = "alt-btn";
      b.textContent = "换" + (SITE_NAMES[o.site] || o.site) + "读这本";
      b.onclick = () => { location.href = altReaderUrl(o); };
      wrap.appendChild(b);
    });
    statusEl.appendChild(wrap);
  }
});
})();
